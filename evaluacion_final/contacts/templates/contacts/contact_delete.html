{% extends "base.html" %}

{% block title %}Eliminar Contacto{% endblock %}

{% block content %}
<div class="container-fluid text-center">
    <h1>Eliminar Contacto</h1>

    <div class="alert alert-danger mt-4" role="alert">
        <h3>¿Estas seguro de que quieres eliminar a <strong>{{ contact.name }}</strong>?</h3>
        <p class="mt-3">No se puede deshacer.</p>
    </div>

    <div class="d-flex justify-content-center gap-3 mt-4">
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Si, eliminar</button>
        </form>
        <a class="btn btn-secondary" href="{% url 'contact_detail' contact.id %}">Cancelar</a>
    </div>
</div>
{% endblock %}
